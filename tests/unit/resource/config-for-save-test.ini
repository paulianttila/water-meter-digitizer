[Poller]
enabled=False
cron=0 */5 * * * *
runonstartup=True
saveimages=False
retryintervalseconds=30

[MQTT]
enabled=False
broker=localhost
port=1883
username=
password=
clientid=water-meter-digitizer
topicprefix=watermeter
keepalive=60
tls=False
retain=True
homeassistantdiscovery=True
discoveryprefix=homeassistant
devicename=Water Meter Digitizer
deviceid=water_meter_digitizer

[ZeroFlowMonitor]
enabled=False
metername=total
valuetype=cumulative
continuousflowhours=2.0
minleakvolume=0.01
flowthreshold=0.001
resolvedebouncecount=2
maxhistoryevents=50



