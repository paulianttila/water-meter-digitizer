[DEFAULT]
loglevel=INFO
configdir=/config
digitalmodelsdir=/config/neuralnets/digital
analogmodelsdir=/config/neuralnets/analog
previousvaluefile=/config/prevalue.ini

[ImageSource]
url=file:///config/original.jpg
timeout=10
minsize=20000

[Crop]
enabled=False
x=100
y=200
w=300
h=400

[Resize]
enabled=False
w=640
h=480

[ImageProcessing]
enabled=False
contrast=1.0
brightness=1.0
color=1.0
gamma=1.0
sharpness=1.0
grayscale=False

[AutoContrast]
Scope=both
Cutoff=1, 45
Ignore=2
CutoffCutImages=3, 46
IgnoreCutImages=4

[GlareSuppression]
Scope=none
Mode=clahe
InpaintThreshold=230
InpaintRadius=3
ClaheClipLimit=2.0
ClaheGridSize=8

[Denoise]
Scope=none
Method=bilateral
Strength=7.0
Diameter=5
SigmaColor=50.0
SigmaSpace=50.0
TemplateWindow=7
SearchWindow=15

[Sharpness]
Mode=standard
Amount=1.5
Radius=1.0
Threshold=3
ApplyToCutouts=False


[Alignment]
rotationangle=180.0
refs=ref0, ref1, ref2
postrotationangle=0.0

[Alignment.ref0]
image=/config/Ref_ZR_x99_y219.jpg
x=99
y=219
w=0
h=0

[Alignment.ref1]
image=/config/Ref_m3_x512_y117.jpg
x=512
y=117
w=0
h=0

[Alignment.ref2]
image=/config/Ref_x0_x301_y386.jpg
x=301
y=386
w=0
h=0

[Meters]
names=digital, analog, total

[Meter.digital]
value={digit1}{digit2}{digit3}{digit4}{digit5}
consistencyenabled=False
allownegativerates=False
maxratevalue=0.0
UsePreviuosValue=False
prevaluefromfilemaxage=0
useextendedresolution=False
unit=

[Meter.analog]
value={analog1}{analog2}{analog3}{analog4}
consistencyenabled=False
allownegativerates=False
maxratevalue=0.0
UsePreviuosValue=False
prevaluefromfilemaxage=0
useextendedresolution=False
unit=

[Meter.total]
value={digit1}{digit2}{digit3}{digit4}{digit5}.{analog1}{analog2}{analog3}{analog4}
consistencyenabled=True
allownegativerates=False
maxratevalue=0.2
UsePreviuosValue=True
prevaluefromfilemaxage=0
useextendedresolution=True
unit=

[Digits]
enabled=True
modelfile=/config/neuralnets/digital/class100/dig-class100_0168_s2_q.tflite
model=auto
names=digit1, digit2, digit3, digit4, digit5

[Analog]
enabled=True
modelfile=/config/neuralnets/analog/continuous/ana-cont_1209_s2.tflite
model=auto
names=analog1, analog2, analog3, analog4

