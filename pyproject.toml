[project]
name = "water-meter-digitizer"
version = "1.0.0"
description = "AI-powered water meter digitizer with NiceGUI dashboard, REST API, MQTT, SQLite/SQLAlchemy metrics, and automated ROI calibration"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "ai-edge-litert>=1.0.0",
    "fastapi>=0.109.2",
    "jinja2>=3.1.4",
    "nicegui>=3.16.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "paho-mqtt>=2.0.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8.0",
    "black>=24.10.0",
    "coverage>=7.6.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.6.0",
    "ruff>=0.8.0",
    "tavern>=3.0.0",
]

[dependency-groups]
dev = [
    "amqtt>=0.12.0",
    "bandit[toml]>=1.8.0",
    "black>=24.10.0",
    "coverage>=7.6.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.6.0",
    "ruff>=0.8.0",
    "tavern>=3.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
# Same as Black.
line-length = 88

# Assume Python 3.11.
target-version = "py311"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), isort (`I`), bugbear (`B`), pyupgrade (`UP`), simplify (`SIM`), ruff-specific (`RUF`).
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
no_implicit_optional = true
warn_return_any = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "dist", "build", "setup.py"]
skips = []

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]
markers = [
  "ui: Web UI integration tests with Playwright",
]
