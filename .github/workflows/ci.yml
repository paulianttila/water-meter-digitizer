name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Static Analysis, Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Mosquitto broker
        run: sudo apt-get update -qq && sudo apt-get install -qq --no-install-recommends mosquitto

      - name: Static analysis (Ruff, Black, Bandit, Mypy)
        run: ./run_tests.sh -s

      - name: Run unit tests
        run: ./run_tests.sh -u

      - name: Run Tavern integration tests
        run: ./run_tests.sh -i

  web-ui:
    name: Web UI Tests (Shard ${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            name: "1/3"
          - shard: 1
            name: "2/3"
          - shard: 2
            name: "3/3"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browsers & dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium

      - name: Run Web UI test shard
        run: uv run pytest tests/integration/ui/ --shard-id=${{ matrix.shard }} --num-shards=3 -v
