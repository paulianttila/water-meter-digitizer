[Template]
Id = axioma_qalcosonic_w1
Category = smart
Brand = Axioma
Model = Qalcosonic W1
Label = Axioma Qalcosonic W1
Description = Ultrasonic smart water meter with digital LCD showing cumulative total and instantaneous flow rate.
Icon = water_drop
MeterTechnology = ultrasonic_lcd
DefaultIntDigits = 6
DefaultDecDigits = 3
DefaultAnalogCount = 0
HasSecondaryGroup = True
DefaultFlowIntDigits = 2
DefaultFlowDecDigits = 3
DefaultUnit = m³
ReferenceWidth = 640
ReferenceHeight = 480
Image = axioma_qalcosonic_w1.png
DigitalCategoryPreference = class11
DigitalPreferredModel = dig-class11_2000_s2.tflite
DigitalCnnType = auto
AnalogCategoryPreference = none
AnalogCnnType = auto
RecommendationReason = class11 discrete models are optimized for 7-segment LCD digits with reverse flow detection.

[ImageProcessing]
Enabled = True
Contrast = 1.35
Gamma = 0.95
Sharpness = 1.2
SharpnessMode = standard
GlareSuppressionEnabled = True
GlareSuppressionMode = clahe
