# Template for contributing a new meter model preset
# Save as <brand_model>.ini in config/meter_types/

[Template]
Id = my_meter_model
Category = mechanical                     # "smart", "mechanical", or "generic"
Brand = Manufacturer Name
Model = Model 123
Label = Manufacturer Model 123 (5+4)
Description = Short explanation of the meter hardware faceplate.
Icon = tune
MeterTechnology = mechanical_dial
DefaultIntDigits = 5
DefaultDecDigits = 0
DefaultAnalogCount = 4
DefaultUnit = m³
ReferenceWidth = 640
ReferenceHeight = 480
Image = my_meter_model.jpg
DigitalCategoryPreference = class100
DigitalPreferredModel = dig-class100_0168_s2_q.tflite
DigitalCnnType = auto
AnalogCategoryPreference = continuous
AnalogPreferredModel = ana-cont_1209_s2.tflite
AnalogCnnType = auto
RecommendationReason = Explain why these CNN models suit this meter hardware.

[ImageProcessing]
Contrast = 1.25
Gamma = 1.15
Sharpness = 1.0
SharpnessMode = unsharp_mask
UnsharpAmount = 1.5
GlareSuppressionEnabled = True
GlareSuppressionMode = clahe
GlareClaheClipLimit = 2.5

[Alignment]
RotationAngle = 0
Refs = ref0, ref1, ref2

[Alignment.ref0]
x = 105
y = 225
w = 32
h = 32

[Alignment.ref1]
x = 515
y = 125
w = 32
h = 32

[Alignment.ref2]
x = 305
y = 395
w = 32
h = 32

[Digits]
Enabled = True
ModelFile = config/neuralnets/digital/class100/dig-class100_0168_s2_q.tflite
Names = digit1, digit2, digit3, digit4, digit5

