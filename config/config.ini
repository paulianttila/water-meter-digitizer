w=115                                                                   # Width of analog dial bounding box ROI in pixels
h=115                                                                   # Height of analog dial bounding box ROI in pixels

[Analog.analog4]
x=163                                                                   # Top-left X-coordinate of analog dial bounding box ROI
y=358                                                                   # Top-left Y-coordinate of analog dial bounding box ROI
w=115                                                                   # Width of analog dial bounding box ROI in pixels
h=115                                                                   # Height of analog dial bounding box ROI in pixels

[History]
Enabled=True                                                            # Flag to enable historical timeseries storage and persistence
Backend=sqlite                                                          # Storage backend: sqlite (persistent file) or memory (in-RAM)
DBUrl=                                                                  # Custom database URL connection string (optional)
MaxMemoryMB=20.0                                                        # Maximum memory threshold in MB for in-memory DB or buffers
MaxRecords=50000                                                        # Maximum row limit before oldest records are FIFO pruned (0 = disable)
RetentionDays=30                                                        # Days to retain readings before automated pruning (0 = retain forever)
AutoVacuum=True                                                         # Flag to enable incremental auto-vacuuming on SQLite database
PruneInterval=50                                                        # Number of write cycles between automated retention pruning runs

[Snapshots]
Enabled=True                                                            # Flag to enable historical image frame archival for Time Machine
Mode=smart_tiered                                                       # Storage strategy: smart_tiered, change_only, roi_strips_only, full_frames, disabled
Format=webp                                                             # Compression format for saved frames: webp or jpeg
Quality=75                                                              # Compression quality factor (1-100)
MaxDiskMB=500.0                                                         # Maximum disk space cap in MB for stored snapshot frames
RecentFullFrameDays=2                                                   # Retention period in days for high-resolution full camera frames
RoiStripRetentionDays=14                                                # Retention period in days for compact composite ROI strips
IdleHeartbeatMinutes=15                                                 # Maximum interval in minutes between snapshot captures when no flow occurs
AlwaysSaveOnAnomaly=True                                                # Always archive full camera frame when OCR error or low confidence occurs
StorageDir=/data/snapshots                                              # Filesystem directory for compressed snapshot storage

[Poller]
Enabled=False                                                           # Flag to enable scheduled background poller
IntervalSeconds=300                                                     # Interval in seconds between background readouts
RunOnStartup=True                                                       # Flag to run a readout immediately on application startup
SaveImages=False                                                        # Flag to save intermediate debug images during polled readouts
RetryIntervalSeconds=30                                                 # Retry interval in seconds on poller failure

[MQTT]
Enabled=True                                                            # Flag to enable MQTT publishing
Broker=localhost                                                        # MQTT broker hostname or IP address
Port=1883                                                               # MQTT broker port
Username=                                                               # MQTT username (optional)
Password=                                                               # MQTT password (optional)
ClientID=water-meter-digitizer                                          # MQTT client identifier
TopicPrefix=watermeter                                                  # Base MQTT topic prefix for published readings and status
KeepAlive=60                                                            # MQTT keepalive interval in seconds
TLS=False                                                               # Flag to enable TLS/SSL encryption for MQTT connection
Retain=True                                                             # Flag to publish telemetry messages with MQTT retain flag
HomeAssistantDiscovery=True                                             # Flag to enable Home Assistant MQTT auto-discovery
DiscoveryPrefix=homeassistant                                           # Home Assistant MQTT discovery prefix
DeviceName=Water Meter Digitizer                                        # Friendly device name reported in Home Assistant discovery
DeviceID=water_meter_digitizer                                          # Unique device ID reported in Home Assistant discovery

[ZeroFlowMonitor]
Enabled=False                                                           # Flag to enable zero-flow tracking & continuous leak detection
MeterName=total                                                         # Target meter name to monitor for continuous flow
ContinuousFlowHours=2.0                                                 # Threshold hours of continuous flow before triggering alert
MinLeakVolume=0.010                                                     # Minimum volume accumulated during continuous flow to flag leak
FlowThreshold=0.001                                                     # Minimum consumption delta (in meter units) to count as active flow
ResolveDebounceCount=2                                                  # Number of consecutive zero readings required to auto-resolve alert
MaxHistoryEvents=50                                                     # Maximum historical leak events to retain in log
