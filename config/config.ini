[DEFAULT]
LogLevel=INFO                                                           # Log level for the application (DEBUG, INFO, WARNING, ERROR)
ConfigDir=/config                                                       # Directory for configuration files and reference markers
DataDir=/data                                                           # Directory path for databases, snapshots, and persistent data
DigitalModelsDir=${ConfigDir}/neuralnets/digital                        # Directory containing digital digit recognition models
AnalogModelsDir=${ConfigDir}/neuralnets/analog                          # Directory containing analog needle recognition models
PreviousValueFile=${ConfigDir}/prevalue.ini                             # File path for persisting previous meter values across readouts
MinConfidenceThreshold=60.0                                             # Global minimum confidence score percentage threshold (0.0-100.0)

[ImageSource]
URL=file://${ConfigDir}/original.jpg                                    # Source image URL (e.g. http://..., https://..., or file://...)
Timeout=10                                                              # Network request timeout in seconds when retrieving image
MinSize=20000                                                           # Minimum image file size in bytes to discard corrupt/partial frames

[Crop]
Enabled=False                                                           # Flag to enable or disable image cropping before alignment
x=100                                                                   # X-coordinate of top-left crop bounding box corner (in pixels)
y=200                                                                   # Y-coordinate of top-left crop bounding box corner (in pixels)
w=300                                                                   # Width of crop bounding box (in pixels)
h=400                                                                   # Height of crop bounding box (in pixels)

[Resize]
Enabled=False                                                           # Flag to enable or disable image resizing before alignment
w=640                                                                   # Target width in pixels for resized image
h=480                                                                   # Target height in pixels for resized image

[ImageProcessing]
Enabled=False                                                           # Flag to enable or disable image processing and filtering
Contrast=1.0                                                            # Contrast adjustment factor (1.0 = unchanged)
Brightness=1.0                                                          # Brightness adjustment factor (1.0 = unchanged)
Color=1.0                                                               # Color saturation adjustment factor (1.0 = unchanged)
Sharpness=1.0                                                           # Sharpness enhancement factor (1.0 = unchanged)
GrayScale=False                                                         # Convert camera image to grayscale before processing
AutoContrast=False                                                      # Apply histogram auto-contrast balancing to full image
AutoContrastCutoffLow=2                                                 # Lower histogram percentile cutoff percentage for auto-contrast
AutoContrastCutoffHigh=45                                               # Upper histogram percentile cutoff percentage for auto-contrast
AutoContrastIgnore=None                                                 # Pixel intensity value to ignore in auto-contrast (or None)
AutoContrastCutImages=False                                             # Apply auto-contrast individually to cropped ROI cutouts
AutoContrastCutImagesCutoffLow=2                                        # Lower percentile cutoff for cropped ROI cutouts auto-contrast
AutoContrastCutImagesCutoffHigh=45                                      # Upper percentile cutoff for cropped ROI cutouts auto-contrast
AutoContrastCutImagesIgnore=None                                        # Pixel intensity value to ignore in cut ROI auto-contrast (or None)
GlareSuppressionEnabled=False                                           # Flag to enable specular glare and reflection suppression
GlareSuppressionMode=clahe                                              # Glare mode: clahe, inpaint, illumination_normalize, combined
GlareInpaintThreshold=230                                               # Luminance threshold (0-255) to detect specular glare hotspots
GlareInpaintRadius=3                                                    # Inpainting neighborhood radius in pixels (Fast Marching)
GlareClaheClipLimit=2.0                                                 # Contrast limiting threshold factor for CLAHE equalization
GlareClaheGridSize=8                                                    # Tile grid division size for CLAHE (e.g. 8 for 8x8 grid)
GlareApplyToCutImages=False                                             # Apply glare suppression individually to cropped ROI cutouts

[Alignment]
RotationAngle=180                                                       # Coarse initial rotation angle in degrees (0, 90, 180, 270)
Refs=ref0, ref1, ref2                                                   # Comma-separated list of reference image section names
PostRotationAngle=0                                                     # Fine-tuning rotation angle in degrees after reference alignment

[Alignment.ref0]
Image=${ConfigDir}/Ref_ZR_x99_y219.jpg                                  # File path of reference template image ref0
x=99                                                                    # Target X-coordinate in aligned pixel coordinate space
y=219                                                                   # Target Y-coordinate in aligned pixel coordinate space
w=0                                                                     # Reference template width in pixels (0 = auto from image)
h=0                                                                     # Reference template height in pixels (0 = auto from image)

[Alignment.ref1]
Image=${ConfigDir}/Ref_m3_x512_y117.jpg                                 # File path of reference template image ref1
x=512                                                                   # Target X-coordinate in aligned pixel coordinate space
y=117                                                                   # Target Y-coordinate in aligned pixel coordinate space
w=0                                                                     # Reference template width in pixels (0 = auto from image)
h=0                                                                     # Reference template height in pixels (0 = auto from image)

[Alignment.ref2]
Image=${ConfigDir}/Ref_x0_x301_y386.jpg                                 # File path of reference template image ref2
x=301                                                                   # Target X-coordinate in aligned pixel coordinate space
y=386                                                                   # Target Y-coordinate in aligned pixel coordinate space
w=0                                                                     # Reference template width in pixels (0 = auto from image)
h=0                                                                     # Reference template height in pixels (0 = auto from image)

[Meters]
Names=digital, analog, total                                            # Comma-separated list of logical meter names

[Meter.digital]
Value={digit1}{digit2}{digit3}{digit4}{digit5}                          # Value template referencing digital digit cutouts
ConsistencyEnabled=False                                                # Flag to enable rate consistency validation check
AllowNegativeRates=False                                                # Flag to allow negative consumption rate changes
MaxRateValue=0.0                                                        # Maximum allowed consumption change rate threshold
UsePreviousValue=False                                                  # Replace unreadable digits (N) with last known valid reading
PreValueFromFileMaxAge=0                                                # Maximum age in minutes to trust previous value from file (0 = no limit)
UseExtendedResolution=False                                             # Append fractional sub-digit decimal resolution from analog needle
Unit=                                                                   # Measurement unit string for readout (e.g. m3, L)

[Meter.analog]
Value={analog1}{analog2}{analog3}{analog4}                              # Value template referencing analog dial needle cutouts
ConsistencyEnabled=False                                                # Flag to enable rate consistency validation check
AllowNegativeRates=False                                                # Flag to allow negative consumption rate changes
MaxRateValue=0.0                                                        # Maximum allowed consumption change rate threshold
UsePreviousValue=False                                                  # Replace unreadable dials (N) with last known valid reading
PreValueFromFileMaxAge=0                                                # Maximum age in minutes to trust previous value from file (0 = no limit)
UseExtendedResolution=True                                              # Append fractional sub-digit decimal resolution from analog needle
Unit=                                                                   # Measurement unit string for readout (e.g. m3, L)

[Meter.total]
Value=${Meter.digital:Value}.${Meter.analog:Value}                      # Value template composing total reading from digital and analog meters
ConsistencyEnabled=True                                                 # Flag to enable rate consistency validation check
AllowNegativeRates=False                                                # Flag to allow negative consumption rate changes
MaxRateValue=0.2                                                        # Maximum allowed consumption change rate threshold
UsePreviousValue=True                                                   # Replace unreadable digits/dials (N) with last known valid reading
PreValueFromFileMaxAge=0                                                # Maximum age in minutes to trust previous value from file (0 = no limit)
UseExtendedResolution=True                                              # Append fractional sub-digit decimal resolution from analog needle
Unit=                                                                   # Measurement unit string for readout (e.g. m3, L)

[Digits]
Enabled=True                                                            # Flag to enable digital digit / rolling drum recognition
Names=digit1, digit2, digit3, digit4, digit5                            # Comma-separated list of digital digit ROI names
Modelfile=${DigitalModelsDir}/class100/dig-class100_0168_s2_q.tflite    # File path of neural network model for digit classification
Model=auto                                                              # Model architecture family/type (auto, digital, digital100)

[Digits.digit1]
x=215                                                                   # Top-left X-coordinate of digit bounding box ROI
y=97                                                                    # Top-left Y-coordinate of digit bounding box ROI
w=42                                                                    # Width of digit bounding box ROI in pixels
h=75                                                                    # Height of digit bounding box ROI in pixels

