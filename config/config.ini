x=273                                                                   # Top-left X-coordinate of digit bounding box ROI
y=97                                                                    # Top-left Y-coordinate of digit bounding box ROI
w=42                                                                    # Width of digit bounding box ROI in pixels
h=75                                                                    # Height of digit bounding box ROI in pixels

[Digits.digit3]
x=332                                                                   # Top-left X-coordinate of digit bounding box ROI
y=97                                                                    # Top-left Y-coordinate of digit bounding box ROI
w=42                                                                    # Width of digit bounding box ROI in pixels
h=75                                                                    # Height of digit bounding box ROI in pixels

[Digits.digit4]
x=390                                                                   # Top-left X-coordinate of digit bounding box ROI
